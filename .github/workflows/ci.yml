
name: Experiment 10 CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify HTML file exists
        run: test -f index.html

      - name: Build and verify webpage
        run: |
          echo "Building the sample webpage..."
          grep -q "My Student Profile" index.html
          echo "Webpage verification successful!"
